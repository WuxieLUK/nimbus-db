[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus-db"
version = "1.0.0"
description = "A SQL database engine built from scratch in pure Python: parser, B+tree storage, WAL durability, indexes, joins, aggregates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EAnge1o" }]
keywords = ["database", "sql", "btree", "wal", "sqlite", "from-scratch", "educational"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
nimbus-db = "nimbus_db.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["nimbus_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
